<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Grapple Shooter 3D</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    touch-action: none;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    color: white;
    text-shadow: 0 2px 5px black;
}

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    font-weight: bold;
}

#stats {
    position: absolute;
    top: 15px;
    left: 15px;
    font-size: 18px;
    font-weight: bold;
}

#help {
    position: absolute;
    top: 15px;
    right: 15px;
    text-align: right;
    font-size: 14px;
    line-height: 1.5;
}

#message {
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 32px;
    font-weight: bold;
    text-align: center;
}

#mobileControls {
    display: none;
}

#joystick {
    position: fixed;
    left: 25px;
    bottom: 25px;
    width: 130px;
    height: 130px;
    border: 2px solid rgba(255,255,255,.35);
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    pointer-events: auto;
}

#stick {
    position: absolute;
    width: 60px;
    height: 60px;
    left: 35px;
    top: 35px;
    border-radius: 50%;
    background: rgba(255,255,255,.35);
}

#mobileButtons {
    position: fixed;
    right: 20px;
    bottom: 25px;
    display: flex;
    gap: 12px;
    pointer-events: auto;
}

.mobileButton {
    border: none;
    border-radius: 15px;
    padding: 18px;
    color: white;
    font-weight: bold;
    font-size: 14px;
    background: rgba(255,255,255,.25);
    backdrop-filter: blur(5px);
}

#fireButton {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    background: rgba(220,40,40,.75);
}

@media (pointer: coarse) {

    #mobileControls {
        display: block;
    }

    #help {
        display: none;
    }
}
</style>
</head>

<body>

<div id="hud">

    <div id="stats">
        ❤️ 100 &nbsp; | &nbsp; Kills: <span id="kills">0</span>
    </div>

    <div id="help">
        WASD = Bewegen<br>
        Maus = Schauen<br>
        Linksklick = Schießen<br>
        G = Grappling Hook<br>
        R = Neustart
    </div>

    <div id="crosshair">+</div>

    <div id="message">
        GRAPPLE SHOOTER
    </div>

</div>

<div id="mobileControls">

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="mobileButtons">

        <button class="mobileButton" id="grappleButton">
            GRAPPLE
        </button>

        <button class="mobileButton" id="fireButton">
            FIRE
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

//////////////////////////////////////////////////////
// SZENE
//////////////////////////////////////////////////////

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x101522);

scene.fog = new THREE.Fog(
    0x101522,
    25,
    120
);


//////////////////////////////////////////////////////
// KAMERA
//////////////////////////////////////////////////////

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    300
);


//////////////////////////////////////////////////////
// RENDERER
//////////////////////////////////////////////////////

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.5)
);

document.body.prepend(renderer.domElement);


//////////////////////////////////////////////////////
// LICHT
//////////////////////////////////////////////////////

const hemisphereLight =
    new THREE.HemisphereLight(
        0xaaccff,
        0x223344,
        2
    );

scene.add(hemisphereLight);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    10,
    20,
    5
);

scene.add(sun);


//////////////////////////////////////////////////////
// BODEN
//////////////////////////////////////////////////////

const ground =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            220,
            220
        ),

        new THREE.MeshStandardMaterial({
            color: 0x27313d,
            roughness: 1
        })

    );

ground.rotation.x = -Math.PI / 2;

scene.add(ground);


//////////////////////////////////////////////////////
// GRID
//////////////////////////////////////////////////////

const grid =
    new THREE.GridHelper(
        220,
        44,
        0x506070,
        0x303945
    );

scene.add(grid);


//////////////////////////////////////////////////////
// HINDERNISSE
//////////////////////////////////////////////////////

const obstacles = [];


function createBox(
    x,
    y,
    z,
    width,
    height,
    depth,
    color = 0x4b6075
) {

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            new THREE.MeshStandardMaterial({
                color: color
            })

        );

    mesh.position.set(
        x,
        y,
        z
    );

    scene.add(mesh);

    obstacles.push(mesh);

    return mesh;
}


for (let i = 0; i < 35; i++) {

    const x =
        (Math.random() - 0.5) * 150;

    const z =
        (Math.random() - 0.5) * 150;

    if (Math.hypot(x, z) < 15) {
        continue;
    }

    createBox(
        x,
        2 + Math.random() * 5,
        z,
        3 + Math.random() * 6,
        4 + Math.random() * 10,
        3 + Math.random() * 6,
        0x3d5266
    );
}


//////////////////////////////////////////////////////
// SPIELER
//////////////////////////////////////////////////////

const player = new THREE.Group();

player.position.set(
    0,
    1.7,
    8
);

scene.add(player);


camera.position.set(
    0,
    1.6,
    0
);

player.add(camera);


//////////////////////////////////////////////////////
// SPIELER VARIABLEN
//////////////////////////////////////////////////////

let yaw = 0;
let pitch = 0;

let hp = 100;
let kills = 0;

let gameOver = false;


//////////////////////////////////////////////////////
// TASTATUR
//////////////////////////////////////////////////////

const keys = {};


window.addEventListener(
    "keydown",
    function(event) {

        keys[event.code] = true;

        if (event.code === "KeyR") {
            resetGame();
        }

        if (event.code === "KeyG") {
            grapple();
        }

    }
);


window.addEventListener(
    "keyup",
    function(event) {

        keys[event.code] = false;

    }
);


//////////////////////////////////////////////////////
// MOUSE LOOK
//////////////////////////////////////////////////////

let pointerLocked = false;


renderer.domElement.addEventListener(
    "click",
    function() {

        if (
            !pointerLocked &&
            matchMedia("(pointer:fine)").matches
        ) {

            renderer.domElement.requestPointerLock();

        }

    }
);


document.addEventListener(
    "pointerlockchange",
    function() {

        pointerLocked =
            document.pointerLockElement ===
            renderer.domElement;

    }
);


document.addEventListener(
    "mousemove",
    function(event) {

        if (!pointerLocked) {
            return;
        }

        yaw -= event.movementX * 0.0025;

        pitch -= event.movementY * 0.0025;

        pitch =
            Math.max(
                -1.4,
                Math.min(1.4, pitch)
            );

    }
);


//////////////////////////////////////////////////////
// SCHIESSEN
//////////////////////////////////////////////////////

window.addEventListener(
    "mousedown",
    function(event) {

        if (event.button === 0) {
            shoot();
        }

    }
);


//////////////////////////////////////////////////////
// ENEMIES
//////////////////////////////////////////////////////

const enemies = [];


function spawnEnemy() {

    const angle =
        Math.random() * Math.PI * 2;

    const distance =
        28 + Math.random() * 35;


    const enemy =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.3,
                2.2,
                1.3
            ),

            new THREE.MeshStandardMaterial({
                color: 0xd94b4b
            })

        );


    enemy.position.set(

        Math.cos(angle) * distance,

        1.1,

        Math.sin(angle) * distance

    );


    enemy.userData = {

        hp: 3,

        attackCooldown: 0

    };


    scene.add(enemy);

    enemies.push(enemy);

}


for (let i = 0; i < 9; i++) {

    spawnEnemy();

}


//////////////////////////////////////////////////////
// BULLETS
//////////////////////////////////////////////////////

const bullets = [];


function shoot() {

    if (gameOver) {
        return;
    }


    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    direction.applyEuler(

        new THREE.Euler(
            pitch,
            yaw,
            0,
            "YXZ"
        )

    );


    direction.normalize();


    const bullet =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                0.12,
                8,
                8
            ),

            new THREE.MeshBasicMaterial({
                color: 0xffe36b
            })

        );


    bullet.position.copy(
        player.position
    );


    bullet.userData.velocity =
        direction.multiplyScalar(45);


    bullet.userData.life = 2;


    scene.add(bullet);

    bullets.push(bullet);

}


//////////////////////////////////////////////////////
// GRAPPLING HOOK
//////////////////////////////////////////////////////

function grapple() {

    if (gameOver) {
        return;
    }


    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    direction.applyEuler(

        new THREE.Euler(
            pitch,
            yaw,
            0,
            "YXZ"
        )

    );


    direction.normalize();


    const raycaster =
        new THREE.Raycaster(

            player.position,

            direction,

            0,

            60

        );


    const hits =
        raycaster.intersectObjects(
            obstacles,
            false
        );


    if (hits.length > 0) {

        const target =
            hits[0].point;


        player.position.lerp(
            target,
            0.55
        );


        player.position.y =
            Math.max(
                1.7,
                player.position.y
            );


        showMessage(
            "GRAPPLE!"
        );

    } else {

        showMessage(
            "Kein Ziel!"
        );

    }

}


//////////////////////////////////////////////////////
// MESSAGE
//////////////////////////////////////////////////////

let messageTimer;


function showMessage(text) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent = text;


    clearTimeout(messageTimer);


    messageTimer =
        setTimeout(
            function() {

                message.textContent = "";

            },
            700
        );

}


//////////////////////////////////////////////////////
// ENEMY TREFFER
//////////////////////////////////////////////////////

function damageEnemy(enemy) {

    enemy.userData.hp--;


    if (enemy.userData.hp <= 0) {

        scene.remove(enemy);


        const index =
            enemies.indexOf(enemy);


        if (index !== -1) {

            enemies.splice(
                index,
                1
            );

        }


        kills++;


        showMessage(
            "+ KILL"
        );


        setTimeout(
            spawnEnemy,
            500
        );

    }

}


//////////////////////////////////////////////////////
// RESET
//////////////////////////////////////////////////////

function resetGame() {

    player.position.set(
        0,
        1.7,
        8
    );


    yaw = 0;
    pitch = 0;


    hp = 100;

    kills = 0;

    gameOver = false;


    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        scene.remove(
            enemies[i]
        );

    }


    enemies.length = 0;


    for (let i = 0; i < 9; i++) {

        spawnEnemy();

    }


    showMessage(
        "NEUES SPIEL"
    );

}


//////////////////////////////////////////////////////
// JOYSTICK
//////////////////////////////////////////////////////

let joystickX = 0;
let joystickY = 0;


const joystick =
    document.getElementById(
        "joystick"
    );


const stick =
    document.getElementById(
        "stick"
    );


function moveJoystick(event) {

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let x =
        event.clientX -
        centerX;


    let y =
        event.clientY -
        centerY;


    const maxDistance = 48;


    const distance =
        Math.hypot(
            x,
            y
        );


    if (
        distance >
        maxDistance
    ) {

        x =
            x / distance *
            maxDistance;

        y =
            y / distance *
            maxDistance;

    }


    joystickX =
        x / maxDistance;


    joystickY =
        y / maxDistance;


    stick.style.transform =
        `translate(${x}px, ${y}px)`;

}


joystick.addEventListener(
    "pointerdown",
    function(event) {

        joystick.setPointerCapture(
            event.pointerId
        );

        moveJoystick(event);

    }
);


joystick.addEventListener(
    "pointermove",
    function(event) {

        moveJoystick(event);

    }
);


joystick.addEventListener(
    "pointerup",
    function() {

        joystickX = 0;
        joystickY = 0;

        stick.style.transform =
            "translate(0px, 0px)";

    }
);


//////////////////////////////////////////////////////
// MOBILE BUTTONS
//////////////////////////////////////////////////////

document
    .getElementById("fireButton")
    .addEventListener(
        "pointerdown",
        shoot
    );


document
    .getElementById("grappleButton")
    .addEventListener(
        "pointerdown",
        grapple
    );


//////////////////////////////////////////////////////
// TOUCH LOOK
//////////////////////////////////////////////////////

let touchLook = null;


renderer.domElement.addEventListener(
    "pointerdown",
    function(event) {

        if (
            event.pointerType === "touch"
        ) {

            touchLook = {

                x: event.clientX,

                y: event.clientY

            };

        }

    }
);


renderer.domElement.addEventListener(
    "pointermove",
    function(event) {

        if (
            !touchLook ||
            event.pointerType !== "touch"
        ) {

            return;

        }


        yaw -=
            (event.clientX -
            touchLook.x) *
            0.006;


        pitch -=
            (event.clientY -
            touchLook.y) *
            0.006;


        pitch =
            Math.max(
                -1.4,
                Math.min(1.4, pitch)
            );


        touchLook = {

            x: event.clientX,

            y: event.clientY

        };

    }
);


renderer.domElement.addEventListener(
    "pointerup",
    function() {

        touchLook = null;

    }
);


//////////////////////////////////////////////////////
// GAME LOOP
//////////////////////////////////////////////////////

const clock =
    new THREE.Clock();


function gameLoop() {

    requestAnimationFrame(
        gameLoop
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    if (!gameOver) {

        //////////////////////////////////////////////
        // SPIELER DREHEN
        //////////////////////////////////////////////

        player.rotation.y = yaw;


        //////////////////////////////////////////////
        // BEWEGUNG
        //////////////////////////////////////////////

        let forward = 0;
        let sideways = 0;


        if (keys.KeyW) {
            forward += 1;
        }

        if (keys.KeyS) {
            forward -= 1;
        }

        if (keys.KeyD) {
            sideways += 1;
        }

        if (keys.KeyA) {
            sideways -= 1;
        }


        forward -= joystickY;

        sideways += joystickX;


        const movement =
            new THREE.Vector3(
                sideways,
                0,
                forward
            );


        if (
            movement.length() > 1
        ) {

            movement.normalize();

        }


        movement.multiplyScalar(
            11 * delta
        );


        movement.applyAxisAngle(
            new THREE.Vector3(
                0,
                1,
                0
            ),
            yaw
        );


        player.position.add(
            movement
        );


        player.position.y =
            1.7;


        //////////////////////////////////////////////
        // BULLETS
        //////////////////////////////////////////////

        for (
            const bullet of bullets
        ) {

            bullet.position.addScaledVector(
                bullet.userData.velocity,
                delta
            );


            bullet.userData.life -=
                delta;


            for (
                const enemy of enemies
            ) {

                if (
                    bullet.position.distanceTo(
                        enemy.position
                    ) < 1
                ) {

                    damageEnemy(
                        enemy
                    );


                    bullet.userData.life =
                        0;


                    break;

                }

            }

        }


        //////////////////////////////////////////////
        // BULLET CLEANUP
        //////////////////////////////////////////////

        for (
            let i = bullets.length - 1;
            i >= 0;
            i--
        ) {

            if (
                bullets[i].userData.life <= 0
            ) {

                scene.remove(
                    bullets[i]
                );


                bullets.splice(
                    i,
                    1
                );

            }

        }


        //////////////////////////////////////////////
        // ENEMIES
        //////////////////////////////////////////////

        for (
            const enemy of enemies
        ) {

            const distance =
                enemy.position.distanceTo(
                    player.position
                );


            if (
                distance < 35
            ) {

                enemy.lookAt(
                    player.position.x,
                    enemy.position.y,
                    player.position.z
                );


                const direction =
                    new THREE.Vector3()
                        .subVectors(
                            player.position,
                            enemy.position
                        );


                direction.y = 0;


                if (
                    direction.length() > 0
                ) {

                    direction.normalize();


                    enemy.position.addScaledVector(
                        direction,
                        2.2 * delta
                    );

                }


                enemy.userData.attackCooldown -=
                    delta;


                if (
                    distance < 4 &&
                    enemy.userData.attackCooldown <= 0
                ) {

                    hp -= 8;


                    enemy.userData.attackCooldown =
                        1;

                }

            }

        }


        //////////////////////////////////////////////
        // GAME OVER
        //////////////////////////////////////////////

        if (hp <= 0) {

            hp = 0;

            gameOver = true;


            showMessage(
                "GAME OVER — R drücken"
            );

        }

    }


    //////////////////////////////////////////////
    // HUD
    //////////////////////////////////////////////

    document.getElementById(
        "stats"
    ).innerHTML =
        `❤️ ${Math.ceil(hp)} &nbsp; | &nbsp; Kills: ${kills}`;


    //////////////////////////////////////////////
    // RENDER
    //////////////////////////////////////////////

    renderer.render(
        scene,
        camera
    );

}


//////////////////////////////////////////////////////
// FENSTERGRÖSSE
//////////////////////////////////////////////////////

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


//////////////////////////////////////////////////////
// START
//////////////////////////////////////////////////////

gameLoop();

</script>

</body>
</html>
