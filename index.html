        <div id="stick"></div>

</div>

<script>

"use strict";

/* =====================================================
   CANVAS
===================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){
    W = window.innerWidth;
    H = window.innerHeight;

    const dpr = Math.min(window.devicePixelRatio || 1,2);

    canvas.width = W*dpr;
    canvas.height = H*dpr;

    canvas.style.width = W+"px";
    canvas.style.height = H+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);
resize();


/* =====================================================
   PLAYER
===================================================== */

const player = {
    x:0,
    y:0,
    angle:0,
    hp:100,
    speed:5
};

let score = 0;
let gameOver = false;


/* =====================================================
   INPUT
===================================================== */

const keys = {};

window.addEventListener("keydown",function(e){

    keys[e.code] = true;

    if(e.code === "KeyR"){
        resetGame();
    }

    if(e.code === "KeyG"){
        grapple();
    }

    if(e.code === "KeyE"){
        pulse();
    }
});

window.addEventListener("keyup",function(e){
    keys[e.code] = false;
});


/* =====================================================
   MOUSE
===================================================== */

let mouseX = W/2;
let mouseY = H/2;

canvas.addEventListener("mousemove",function(e){

    mouseX = e.clientX;
    mouseY = e.clientY;

    const dx = mouseX-W/2;
    const dy = mouseY-H/2;

    if(Math.abs(dx)>5){
        player.angle += dx*0.002;
    }

});


canvas.addEventListener("click",function(){

    pulse();

});


/* =====================================================
   MOBILE JOYSTICK
===================================================== */

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joyX = 0;
let joyY = 0;
let joyPointer = null;

function moveJoystick(e){

    const rect = joystick.getBoundingClientRect();

    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;

    let x = e.clientX-cx;
    let y = e.clientY-cy;

    const max = 45;

    const len = Math.hypot(x,y);

    if(len>max){
        x=x/len*max;
        y=y/len*max;
    }

    joyX=x/max;
    joyY=y/max;

    stick.style.transform =
        `translate(${x}px,${y}px)`;
}

joystick.addEventListener("pointerdown",function(e){

    joyPointer=e.pointerId;

    joystick.setPointerCapture(e.pointerId);

    moveJoystick(e);
});

joystick.addEventListener("pointermove",function(e){

    if(e.pointerId===joyPointer){
        moveJoystick(e);
    }

});

function stopJoystick(){

    joyX=0;
    joyY=0;
    joyPointer=null;

    stick.style.transform="translate(0,0)";
}

joystick.addEventListener("pointerup",stopJoystick);
joystick.addEventListener("pointercancel",stopJoystick);


/* =====================================================
   MOBILE BUTTONS
===================================================== */

document.getElementById("grapple")
.addEventListener("pointerdown",function(e){

    e.preventDefault();
    grapple();

});

document.getElementById("pulse")
.addEventListener("pointerdown",function(e){

    e.preventDefault();
    pulse();

});


/* =====================================================
   WORLD
===================================================== */

const buildings = [];

function createWorld(){

    buildings.length=0;

    for(let i=0;i<45;i++){

        let x;
        let y;

        do{

            x=(Math.random()-.5)*1800;
            y=(Math.random()-.5)*1800;

        }while(Math.hypot(x,y)<300);

        buildings.push({

            x:x,
            y:y,

            w:80+Math.random()*120,
            h:80+Math.random()*180,

            type:Math.random()<.5 ? "building":"crate"

        });

    }

}

createWorld();


/* =====================================================
   ENEMIES
===================================================== */

const enemies = [];

function createEnemy(){

    const angle =
        Math.random()*Math.PI*2;

    const distance =
        450+Math.random()*700;

    return {

        x:player.x+
            Math.cos(angle)*distance,

        y:player.y+
            Math.sin(angle)*distance,

        hp:3,

        speed:35+Math.random()*20,

        attackCooldown:0,

        knockX:0,
        knockY:0,

        size:35

    };

}

function spawnEnemy(){

    enemies.push(createEnemy());

}

for(let i=0;i<10;i++){
    spawnEnemy();
}


/* =====================================================
   PROJECTILES
===================================================== */

const projectiles = [];

function shootProjectile(enemy){

    const dx=player.x-enemy.x;
    const dy=player.y-enemy.y;

    const len=Math.hypot(dx,dy);

    if(len===0)return;

    projectiles.push({

        x:enemy.x,
        y:enemy.y,

        vx:dx/len*220,
        vy:dy/len*220,

        life:4

    });

}


/* =====================================================
   PARTICLES
===================================================== */

const particles=[];

function particlesAt(x,y,count=15){

    for(let i=0;i<count;i++){

        const a=Math.random()*Math.PI*2;
        const speed=40+Math.random()*180;

        particles.push({

            x:x,
            y:y,

            vx:Math.cos(a)*speed,
            vy:Math.sin(a)*speed,

            life:.4+Math.random()*.6

        });

    }

}


/* =====================================================
   GRAPPLE
===================================================== */

let grappleTarget=null;
let grappleTimer=0;

function grapple(){

    if(gameOver)return;

    let best=null;
    let bestDistance=Infinity;

    for(const b of buildings){

        const dx=b.x-player.x;
        const dy=b.y-player.y;

        const distance=Math.hypot(dx,dy);

        if(distance<900 && distance<bestDistance){

            best=b;
            bestDistance=distance;

        }

    }

    if(!best){

        showMessage("🪝 KEIN ZIEL");
        return;

    }

    grappleTarget={
        x:best.x,
        y:best.y
    };

    grappleTimer=1;

    showMessage("🪝 GRAPPLE!");

}


/* =====================================================
   PULSE
===================================================== */

function pulse(){

    if(gameOver)return;

    const range=330;

    particlesAt(player.x,player.y,25);

    let hitSomething=false;

    for(const enemy of [...enemies]){

        const dx=enemy.x-player.x;
        const dy=enemy.y-player.y;

        const distance=Math.hypot(dx,dy);

        if(distance>range)continue;

        const angleToEnemy=Math.atan2(dy,dx);

        let diff =
            normalizeAngle(
                angleToEnemy-player.angle
            );

        if(Math.abs(diff)>1.2)continue;

        hitSomething=true;

        enemy.hp--;

        const power=500;

        enemy.knockX =
            Math.cos(angleToEnemy)*power;

        enemy.knockY =
            Math.sin(angleToEnemy)*power;

        particlesAt(
            enemy.x,
            enemy.y,
            12
        );

        if(enemy.hp<=0){

            score+=100;

            const index=enemies.indexOf(enemy);

            if(index!==-1){
                enemies.splice(index,1);
            }

            setTimeout(spawnEnemy,600);

        }

    }

    if(hitSomething){
        showMessage("⚡ TREFFER!");
    }

}


/* =====================================================
   ANGLE
===================================================== */

function normalizeAngle(a){

    while(a>Math.PI)a-=Math.PI*2;
    while(a<-Math.PI)a+=Math.PI*2;

    return a;

}


/* =====================================================
   PLAYER UPDATE
===================================================== */

function updatePlayer(dt){

    if(gameOver)return;

    let forward=0;
    let strafe=0;

    if(keys.KeyW)forward+=1;
    if(keys.KeyS)forward-=1;

    if(keys.KeyA)strafe-=1;
    if(keys.KeyD)strafe+=1;

    /*
       Joystick:
       oben = -1
       unten = +1

       Deshalb wird Y umgedreht.
    */

    forward-=joyY;
    strafe+=joyX;

    const length=Math.hypot(forward,strafe);

    if(length>1){

        forward/=length;
        strafe/=length;

    }

    const speed=player.speed*60*dt;

    const forwardX=Math.cos(player.angle);
    const forwardY=Math.sin(player.angle);

    const rightX=-Math.sin(player.angle);
    const rightY=Math.cos(player.angle);

    player.x +=
        (forwardX*forward+
         rightX*strafe)*speed;

    player.y +=
        (forwardY*forward+
         rightY*strafe)*speed;


    /* Grapple */

    if(grappleTarget && grappleTimer>0){

        const dx=
            grappleTarget.x-player.x;

        const dy=
            grappleTarget.y-player.y;

        const distance=
            Math.hypot(dx,dy);

        if(distance<40){

            grappleTarget=null;
            grappleTimer=0;

        }else{

            const pull=500*dt;

            player.x +=
                dx/distance*pull;

            player.y +=
                dy/distance*pull;

        }

        grappleTimer-=dt;

    }

}


/* =====================================================
   ENEMY UPDATE
===================================================== */

function updateEnemies(dt){

    if(gameOver)return;

    for(const enemy of enemies){

        const dx=player.x-enemy.x;
        const dy=player.y-enemy.y;

        const distance=Math.hypot(dx,dy);

        if(distance>0){

            enemy.x +=
                dx/distance*
                enemy.speed*
                dt;

            enemy.y +=
                dy/distance*
                enemy.speed*
                dt;

        }

        /* Knockback */

        enemy.x +=
            enemy.knockX*dt;

        enemy.y +=
            enemy.knockY*dt;

        enemy.knockX*=.88;
        enemy.knockY*=.88;


        /* Angriff */

        enemy.attackCooldown-=dt;

        if(distance<180){

            if(
                enemy.attackCooldown<=0
            ){

                shootProjectile(enemy);

                enemy.attackCooldown=1.3;

            }

        }

    }

}


/* =====================================================
   PROJECTILE UPDATE
===================================================== */

function updateProjectiles(dt){

    for(let i=projectiles.length-1;i>=0;i--){

        const p=projectiles[i];

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.life-=dt;

        const distance=
            Math.hypot(
                p.x-player.x,
                p.y-player.y
            );

        if(distance<25){

            player.hp-=8;

            particlesAt(
                player.x,
                player.y,
                10
            );

            projectiles.splice(i,1);

            showMessage("⚠️ GETROFFEN!");

            if(player.hp<=0){

                player.hp=0;
                gameOver=true;

                showMessage(
                    "GAME OVER — R drücken"
                );

            }

            continue;

        }

        if(p.life<=0){

            projectiles.splice(i,1);

        }

    }

}


/* =====================================================
   PARTICLE UPDATE
===================================================== */

function updateParticles(dt){

    for(let i=particles.length-1;i>=0;i--){

        const p=particles[i];

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.vx*=.94;
        p.vy*=.94;

        p.life-=dt;

        if(p.life<=0){

            particles.splice(i,1);

        }

    }

}


/* =====================================================
   CAMERA / DRAW
===================================================== */

function worldToScreen(x,y){

    const dx=x-player.x;
    const dy=y-player.y;

    const cos=Math.cos(-player.angle);
    const sin=Math.sin(-player.angle);

    const rx=dx*cos-dy*sin;
    const ry=dx*sin+dy*cos;

    return {
        x:W/2+rx*.55,
        y:H/2+ry*.55,
        depth:Math.hypot(rx,ry)
    };

}


/* =====================================================
   DRAW BACKGROUND
===================================================== */

function drawBackground(){

    const gradient=
        ctx.createLinearGradient(
            0,0,0,H
        );

    gradient.addColorStop(
        0,
        "#162b42"
    );

    gradient.addColorStop(
        .55,
        "#25394a"
    );

    gradient.addColorStop(
        1,
        "#101820"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,0,W,H
    );

}


/* =====================================================
   DRAW GROUND GRID
===================================================== */

function drawGrid(){

    ctx.save();

    ctx.translate(W/2,H/2);

    ctx.rotate(-player.angle);

    const size=100;
    const spacing=100;

    ctx.strokeStyle=
        "rgba(100,180,220,.15)";

    ctx.lineWidth=1;

    for(
        let x=-1500;
        x<=1500;
        x+=spacing
    ){

        ctx.beginPath();

        ctx.moveTo(
            x*.55,
            -1500*.55
        );

        ctx.lineTo(
            x*.55,
            1500*.55
        );

        ctx.stroke();

    }

    for(
        let y=-1500;
        y<=1500;
        y+=spacing
    ){

        ctx.beginPath();

        ctx.moveTo(
            -1500*.55,
            y*.55
        );

        ctx.lineTo(
            1500*.55,
            y*.55
        );

        ctx.stroke();

    }

    ctx.restore();

}


/* =====================================================
   DRAW BUILDINGS
===================================================== */

function drawBuildings(){

    const sorted=
        [...buildings]
        .sort(
            (a,b)=>{

                const da=
                    Math.hypot(
                        a.x-player.x,
                        a.y-player.y
                    );

                const db=
                    Math.hypot(
                        b.x-player.x,
                        b.y-player.y
                    );

                return db-da;

            }
        );


    for(const b of sorted){

        const s=
            worldToScreen(
                b.x,
                b.y
            );

        if(
            s.x<-300 ||
            s.x>W+300 ||
            s.y<-300 ||
            s.y>H+300
        ){
            continue;
        }

        const size=
            Math.max(
                12,
                16000/
                Math.max(
                    s.depth,
                    50
                )
            );

        const height=
            size*
            (b.h/150);


        ctx.fillStyle=
            b.type==="building"
            ? "#34495e"
            : "#795548";

        ctx.fillRect(
            s.x-size/2,
            s.y-height,
            size,
            height
        );


        ctx.fillStyle=
            b.type==="building"
            ? "#253746"
            : "#5d4037";

        ctx.fillRect(
            s.x-size/2,
            s.y-height,
            size,
            8
        );


        if(
            b.type==="building"
        ){

            ctx.fillStyle=
                "#55d6ff";

            for(
                let row=0;
                row<3;
                row++
            ){

                ctx.fillRect(

                    s.x-size*.3,

                    s.y-height+
                    20+
                    row*25,

                    size*.12,

                    10

                );

                ctx.fillRect(

                    s.x,

                    s.y-height+
                    20+
                    row*25,

                    size*.12,

                    10

                );

            }

        }

    }

}


/* =====================================================
   DRAW ENEMIES
===================================================== */

function drawEnemies(){

    for(const enemy of enemies){

        const s=
            worldToScreen(
                enemy.x,
                enemy.y
            );

        if(
            s.x<-100 ||
            s.x>W+100 ||
            s.y<-100 ||
            s.y>H+100
        ){
            continue;
        }

        const size=
            Math.max(
                15,
                18000/
                Math.max(
                    s.depth,
                    50
                )
            );


        /* Schatten */

        ctx.fillStyle=
            "rgba(0,0,0,.35)";

        ctx.beginPath();

        ctx.ellipse(
            s.x,
            s.y+size*.35,
            size*.45,
            size*.15,
            0,0,Math.PI*2
        );

        ctx.fill();


        /* Körper */

        ctx.fillStyle="#566b7f";

        ctx.fillRect(
            s.x-size*.32,
            s.y-size*.05,
            size*.64,
            size*.65
        );


        /* Kopf */

        ctx.fillStyle="#71879b";

        ctx.fillRect(
            s.x-size*.38,
            s.y-size*.55,
            size*.76,
            size*.42
        );


        /* Augen */

        ctx.fillStyle="#44eaff";

        ctx.fillRect(
            s.x-size*.23,
            s.y-size*.42,
            size*.13,
            size*.07
        );

        ctx.fillRect(
            s.x+size*.10,
            s.y-size*.42,
            size*.13,
            size*.07
        );


        /* Arme */

        ctx.fillStyle="#304354";

        ctx.fillRect(
            s.x-size*.52,
            s.y,
            size*.16,
            size*.55
        );

        ctx.fillRect(
            s.x+size*.36,
            s.y,
            size*.16,
            size*.55
        );


        /* Beine */

        ctx.fillRect(
            s.x-size*.25,
            s.y+size*.6,
            size*.17,
            size*.45
        );

        ctx.fillRect(
            s.x+size*.08,
            s.y+size*.6,
            size*.17,
            size*.45
        );


        /* Lebensanzeige */

        ctx.fillStyle="#222";

        ctx.fillRect(
            s.x-size*.45,
            s.y-size*.78,
            size*.9,
            6
        );

        ctx.fillStyle="#46e66b";

        ctx.fillRect(
            s.x-size*.45,
            s.y-size*.78,
            size*.3*
            enemy.hp,
            6
        );

    }

}


/* =====================================================
   DRAW PROJECTILES
===================================================== */

function drawProjectiles(){

    for(const p of projectiles){

        const s=
            worldToScreen(
                p.x,
                p.y
            );

        ctx.fillStyle="#ff6b4a";

        ctx.shadowBlur=15;
        ctx.shadowColor="#ff4d2e";

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            7,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur=0;

    }

}


/* =====================================================
   DRAW PARTICLES
===================================================== */

function drawParticles(){

    for(const p of particles){

        const s=
            worldToScreen(
                p.x,
                p.y
            );

        ctx.fillStyle=
            "rgba(70,220,255,"+
            Math.max(0,p.life)+
            ")";

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =====================================================
   DRAW GRAPPLE
===================================================== */

function drawGrapple(){

    if(!grappleTarget)return;

    const s=
        worldToScreen(
            grappleTarget.x,
            grappleTarget.y
        );

    ctx.strokeStyle="#4deaff";

    ctx.lineWidth=4;

    ctx.shadowBlur=12;
    ctx.shadowColor="#4deaff";

    ctx.beginPath();

    ctx.moveTo(
        W/2,
        H/2
    );

    ctx.lineTo(
        s.x,
        s.y
    );

    ctx.stroke();

    ctx.shadowBlur=0;

    ctx.fillStyle="#66efff";

    ctx.beginPath();

    ctx.arc(
        s.x,
        s.y,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   DRAW PLAYER HAND
===================================================== */

function drawHand(){

    const x=W-120;
    const y=H-80;

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(-.25);

    /* Arm */

    ctx.fillStyle="#26394a";

    ctx.fillRect(
        -35,
        10,
        75,
        170
    );


    /* Glove */

    ctx.fillStyle="#60798f";

    ctx.beginPath();

    ctx.roundRect(
        -70,
        -45,
        125,
        90,
        25
    );

    ctx.fill();


    /* Grapple device */

    ctx.fillStyle="#1a9fff";

    ctx.shadowBlur=20;
    ctx.shadowColor="#36dfff";

    ctx.beginPath();

    ctx.moveTo(
        -20,-30
    );

    ctx.lineTo(
        15,5
    );

    ctx.lineTo(
        -20,40
    );

    ctx.lineTo(
        -55,5
    );

    ctx.closePath();

    ctx.fill();

    ctx.shadowBlur=0;

    ctx.restore();

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    drawBackground();

    drawGrid();

    drawBuildings();

    drawEnemies();

    drawProjectiles();

    drawParticles();

    drawGrapple();

    drawHand();

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    document.getElementById("hp")
        .textContent=Math.ceil(player.hp);

    document.getElementById("score")
        .textContent=score;

    document.getElementById("enemies")
        .textContent=enemies.length;

}


/* =====================================================
   MESSAGE
===================================================== */

let messageTimeout;

function showMessage(text){

    const el=
        document.getElementById("message");

    el.textContent=text;

    el.classList.add("show");

    clearTimeout(messageTimeout);

    messageTimeout=setTimeout(
        function(){
            el.classList.remove("show");
        },
        800
    );

}


/* =====================================================
   RESET
===================================================== */

function resetGame(){

    player.x=0;
    player.y=0;
    player.angle=0;
    player.hp=100;

    score=0;
    gameOver=false;

    enemies.length=0;
    projectiles.length=0;
    particles.length=0;

    grappleTarget=null;
    grappleTimer=0;

    for(let i=0;i<10;i++){
        spawnEnemy();
    }

    showMessage("NEUES SPIEL");

}


/* =====================================================
   GAME LOOP
===================================================== */

let lastTime=performance.now();

function loop(now){

    const dt=
        Math.min(
            (now-lastTime)/1000,
            .033
        );

    lastTime=now;

    updatePlayer(dt);
    updateEnemies(dt);
    updateProjectiles(dt);
    updateParticles(dt);

    draw();
    updateHUD();

    requestAnimationFrame(loop);

}


/* =====================================================
   START
===================================================== */

showMessage("GRAPPLE ARENA");

requestAnimationFrame(loop);

</script>
