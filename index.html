<script>

/* =====================================================
   UPDATE 4
   KOMPLETT OHNE EXTERNE BIBLIOTHEKEN
===================================================== */

"use strict";


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


let width = 0;
let height = 0;


function resize(){

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        width * ratio;

    canvas.height =
        height * ratio;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resize
);

resize();


/* =====================================================
   PLAYER
===================================================== */

const player = {

    x:0,
    y:0,

    angle:-Math.PI/2,

    speed:260,

    hp:100

};


let score = 0;

let gameOver = false;


/* =====================================================
   KEYBOARD
===================================================== */

const keys = {};


window.addEventListener(
    "keydown",
    function(event){

        keys[event.code] = true;


        if(
            event.code === "KeyR"
        ){

            resetGame();

        }


        if(
            event.code === "KeyE"
        ){

            shoot();

        }


        if(
            event.code === "KeyG"
        ){

            grapple();

        }

    }
);


window.addEventListener(
    "keyup",
    function(event){

        keys[event.code] = false;

    }
);


/* =====================================================
   MOUSE
===================================================== */

let mouseDown = false;


canvas.addEventListener(
    "pointerdown",
    function(event){

        if(
            event.pointerType === "mouse"
        ){

            mouseDown = true;

        }

    }
);


window.addEventListener(
    "pointerup",
    function(){

        mouseDown = false;

    }
);


window.addEventListener(
    "mousemove",
    function(event){

        if(
            event.buttons === 0
        ){

            return;

        }

        player.angle +=
            event.movementX * .004;

    }
);


/* =====================================================
   TOUCH LOOK
===================================================== */

let lastTouchX = null;


canvas.addEventListener(
    "touchstart",
    function(event){

        if(
            event.touches.length
        ){

            lastTouchX =
                event.touches[0].clientX;

        }

    },
    {passive:false}
);


canvas.addEventListener(
    "touchmove",
    function(event){

        if(
            event.touches.length &&
            lastTouchX !== null
        ){

            const x =
                event.touches[0].clientX;

            player.angle +=
                (x-lastTouchX)*.008;

            lastTouchX = x;

        }

        event.preventDefault();

    },
    {passive:false}
);


canvas.addEventListener(
    "touchend",
    function(){

        lastTouchX = null;

    }
);


/* =====================================================
   MOBILE JOYSTICK
===================================================== */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );


let joystickX = 0;
let joystickY = 0;
let joystickPointer = null;


function updateJoystick(event){

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width/2;


    const centerY =
        rect.top +
        rect.height/2;


    let x =
        event.clientX -
        centerX;


    let y =
        event.clientY -
        centerY;


    const max = 45;

    const distance =
        Math.hypot(x,y);


    if(
        distance > max
    ){

        x =
            x/distance*max;

        y =
            y/distance*max;

    }


    joystickX =
        x/max;

    joystickY =
        y/max;


    stick.style.transform =
        "translate("+x+"px,"+y+"px)";

}


joystick.addEventListener(
    "pointerdown",
    function(event){

        joystickPointer =
            event.pointerId;

        joystick.setPointerCapture(
            event.pointerId
        );

        updateJoystick(event);

    }
);


joystick.addEventListener(
    "pointermove",
    function(event){

        if(
            event.pointerId ===
            joystickPointer
        ){

            updateJoystick(event);

        }

    }
);


function stopJoystick(){

    joystickX = 0;
    joystickY = 0;

    joystickPointer = null;

    stick.style.transform =
        "translate(0,0)";

}


joystick.addEventListener(
    "pointerup",
    stopJoystick
);

joystick.addEventListener(
    "pointercancel",
    stopJoystick
);


/* =====================================================
   MOBILE BUTTONS
===================================================== */

document
.getElementById("grappleButton")
.addEventListener(
    "pointerdown",
    function(event){

        event.preventDefault();

        grapple();

    }
);


document
.getElementById("pulseButton")
.addEventListener(
    "pointerdown",
    function(event){

        event.preventDefault();

        shoot();

    }
);


/* =====================================================
   MAP
===================================================== */

const buildings = [];


function createMap(){

    buildings.length = 0;


    for(
        let i=0;
        i<35;
        i++
    ){

        let x;
        let y;


        do{

            x =
                (Math.random()-.5) *
                2600;

            y =
                (Math.random()-.5) *
                2600;

        }
        while(
            Math.hypot(x,y)<350
        );


        buildings.push({

            x:x,
            y:y,

            width:
                100+
                Math.random()*150,

            height:
                100+
                Math.random()*220

        });

    }

}


createMap();


/* =====================================================
   ENEMIES
===================================================== */

const enemies = [];


function createEnemy(){

    const angle =
        Math.random() *
        Math.PI*2;


    const distance =
        650+
        Math.random()*900;


    return {

        x:
            player.x+
            Math.cos(angle)*
            distance,

        y:
            player.y+
            Math.sin(angle)*
            distance,

        hp:3,

        speed:
            70+
            Math.random()*40,

        attackTimer:
            1+
            Math.random()*2,

        size:40,

        knockX:0,

        knockY:0

    };

}


function spawnEnemy(){

    enemies.push(
        createEnemy()
    );

}


for(
    let i=0;
    i<8;
    i++
){

    spawnEnemy();

}


/* =====================================================
   PROJECTILES
===================================================== */

const projectiles = [];


function shootProjectile(
    enemy
){

    const dx =
        player.x -
        enemy.x;


    const dy =
        player.y -
        enemy.y;


    const distance =
        Math.hypot(dx,dy);


    if(
        distance === 0
    ){

        return;

    }


    projectiles.push({

        x:enemy.x,

        y:enemy.y,

        vx:
            dx/distance*420,

        vy:
            dy/distance*420,

        life:4

    });

}


/* =====================================================
   PLAYER SHOOT
===================================================== */

function shoot(){

    if(
        gameOver
    ){

        return;

    }


    const range = 900;

    let target = null;

    let targetDistance =
        Infinity;


    for(
        const enemy of enemies
    ){

        const dx =
            enemy.x -
            player.x;


        const dy =
            enemy.y -
            player.y;


        const distance =
            Math.hypot(dx,dy);


        if(
            distance >
            range
        ){

            continue;

        }


        const enemyAngle =
            Math.atan2(
                dy,
                dx
            );


        let difference =
            normalizeAngle(
                enemyAngle -
                player.angle
            );


        if(
            Math.abs(difference)
            > .35
        ){

            continue;

        }


        if(
            distance <
            targetDistance
        ){

            target =
                enemy;

            targetDistance =
                distance;

        }

    }


    createParticles(
        player.x+
        Math.cos(player.angle)*35,

        player.y+
        Math.sin(player.angle)*35,

        10
    );


    if(
        target
    ){

        target.hp--;

        target.knockX =
            Math.cos(player.angle)*
            500;

        target.knockY =
            Math.sin(player.angle)*
            500;


        createParticles(
            target.x,
            target.y,
            15
        );


        showMessage(
            "🎯 TREFFER!"
        );


        if(
            target.hp <= 0
        ){

            const index =
                enemies.indexOf(
                    target
                );


            if(
                index !== -1
            ){

                enemies.splice(
                    index,
                    1
                );

            }


            score += 100;


            setTimeout(
                spawnEnemy,
                700
            );

        }

    }

}


/* =====================================================
   GRAPPLE
===================================================== */

let grappleTarget = null;

let grappleTime = 0;


function grapple(){

    if(
        gameOver
    ){

        return;

    }


    let best = null;

    let bestDistance =
        Infinity;


    for(
        const building of buildings
    ){

        const dx =
            building.x -
            player.x;


        const dy =
            building.y -
            player.y;


        const distance =
            Math.hypot(dx,dy);


        if(
            distance <
            1000 &&
            distance <
            bestDistance
        ){

            best =
                building;

            bestDistance =
                distance;

        }

    }


    if(
        !best
    ){

        showMessage(
            "🪝 KEIN ZIEL"
        );

        return;

    }


    grappleTarget = {

        x:best.x,

        y:best.y

    };


    grappleTime = 1.5;


    showMessage(
        "🪝 GRAPPLE!"
    );

}


/* =====================================================
   PARTICLES
===================================================== */

const particles = [];


function createParticles(
    x,
    y,
    amount
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        const angle =
            Math.random()*
            Math.PI*2;


        const speed =
            50+
            Math.random()*220;


        particles.push({

            x:x,

            y:y,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            life:
                .4+
                Math.random()*.5

        });

    }

}


/* =====================================================
   PLAYER UPDATE
===================================================== */

function updatePlayer(
    dt
){

    if(
        gameOver
    ){

        return;

    }


    let forward = 0;

    let strafe = 0;


    if(
        keys.KeyW
    ){

        forward += 1;

    }


    if(
        keys.KeyS
    ){

        forward -= 1;

    }


    if(
        keys.KeyA
    ){

        strafe -= 1;

    }


    if(
        keys.KeyD
    ){

        strafe += 1;

    }


    /*
       Joystick:
       oben = vorwärts
       unten = rückwärts
    */

    forward -=
        joystickY;

    strafe +=
        joystickX;


    const length =
        Math.hypot(
            forward,
            strafe
        );


    if(
        length > 1
    ){

        forward /=
            length;

        strafe /=
            length;

    }


    const cos =
        Math.cos(
            player.angle
        );


    const sin =
        Math.sin(
            player.angle
        );


    player.x +=
        (
            cos*forward -
            sin*strafe
        )*
        player.speed*
        dt;


    player.y +=
        (
            sin*forward +
            cos*strafe
        )*
        player.speed*
        dt;


    /* Grapple */

    if(
        grappleTarget &&
        grappleTime > 0
    ){

        const dx =
            grappleTarget.x -
            player.x;


        const dy =
            grappleTarget.y -
            player.y;


        const distance =
            Math.hypot(dx,dy);


        if(
            distance < 30
        ){

            grappleTarget =
                null;

            grappleTime =
                0;

        }
        else{

            const pull =
                Math.min(
                    850*dt,
                    distance
                );


            player.x +=
                dx/distance*
                pull;


            player.y +=
                dy/distance*
                pull;

        }


        grappleTime -=
            dt;

    }

}


/* =====================================================
   ENEMY UPDATE
===================================================== */

function updateEnemies(
    dt
){

    if(
        gameOver
    ){

        return;

    }


    for(
        const enemy of enemies
    ){

        const dx =
            player.x -
            enemy.x;


        const dy =
            player.y -
            enemy.y;


        const distance =
            Math.hypot(dx,dy);


        if(
            distance > 0
        ){

            enemy.x +=
                dx/distance*
                enemy.speed*
                dt;


            enemy.y +=
                dy/distance*
                enemy.speed*
                dt;

        }


        /* Knockback */

        enemy.x +=
            enemy.knockX*
            dt;

        enemy.y +=
            enemy.knockY*
            dt;


        enemy.knockX *=
            Math.pow(.02,dt);

        enemy.knockY *=
            Math.pow(.02,dt);


        /* Gegner schießt */

        enemy.attackTimer -=
            dt;


        if(
            distance < 800 &&
            enemy.attackTimer <= 0
        ){

            shootProjectile(
                enemy
            );


            enemy.attackTimer =
                1.5+
                Math.random()*
                1.2;

        }


        /* Kontakt */

        if(
            distance < 55
        ){

            player.hp -=
                15*dt;

        }

    }

}


/* =====================================================
   PROJECTILE UPDATE
===================================================== */

function updateProjectiles(
    dt
){

    for(
        let i=
            projectiles.length-1;
        i>=0;
        i--
    ){

        const projectile =
            projectiles[i];


        projectile.x +=
            projectile.vx*
            dt;


        projectile.y +=
            projectile.vy*
            dt;


        projectile.life -=
            dt;


        const distance =
            Math.hypot(
                projectile.x-
                player.x,

                projectile.y-
                player.y
            );


        if(
            distance < 30
        ){

            player.hp -=
                12;


            createParticles(
                player.x,
                player.y,
                12
            );


            projectiles.splice(
                i,
                1
            );


            showMessage(
                "⚠️ GETROFFEN!"
            );


            continue;

        }


        if(
            projectile.life <= 0
        ){

            projectiles.splice(
                i,
                1
            );

        }

    }

}


/* =====================================================
   PARTICLE UPDATE
===================================================== */

function updateParticles(
    dt
){

    for(
        let i=
            particles.length-1;
        i>=0;
        i--
    ){

        const particle =
            particles[i];


        particle.x +=
            particle.vx*
            dt;


        particle.y +=
            particle.vy*
            dt;


        particle.vx *=
            .94;

        particle.vy *=
            .94;


        particle.life -=
            dt;


        if(
            particle.life <= 0
        ){

            particles.splice(
                i,
                1
            );

        }

    }

}


/* =====================================================
   WORLD TO SCREEN
===================================================== */

function worldToScreen(
    x,
    y
){

    const dx =
        x-player.x;


    const dy =
        y-player.y;


    const cos =
        Math.cos(
            -player.angle
        );


    const sin =
        Math.sin(
            -player.angle
        );


    const screenX =
        dx*cos -
        dy*sin;


    const screenY =
        dx*sin +
        dy*cos;


    return {

        x:
            width/2+
            screenX*.55,

        y:
            height/2+
            screenY*.55,

        distance:
            Math.hypot(
                screenX,
                screenY
            )

    };

}


/* =====================================================
   DRAW BACKGROUND
===================================================== */

function drawBackground(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );


    gradient.addColorStop(
        0,
        "#162d45"
    );


    gradient.addColorStop(
        .55,
        "#294052"
    );


    gradient.addColorStop(
        1,
        "#11191f"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        width,
        height
    );

}


/* =====================================================
   DRAW GRID
===================================================== */

function drawGrid(){

    ctx.save();

    ctx.translate(
        width/2,
        height/2
    );


    ctx.rotate(
        -player.angle
    );


    ctx.strokeStyle =
        "rgba(130,210,240,.18)";


    ctx.lineWidth = 1;


    const spacing = 100;


    for(
        let x=-2000;
        x<=2000;
        x+=spacing
    ){

        ctx.beginPath();

        ctx.moveTo(
            x*.55,
            -2000*.55
        );

        ctx.lineTo(
            x*.55,
            2000*.55
        );

        ctx.stroke();

    }


    for(
        let y=-2000;
        y<=2000;
        y+=spacing
    ){

        ctx.beginPath();

        ctx.moveTo(
            -2000*.55,
            y*.55
        );

        ctx.lineTo(
            2000*.55,
            y*.55
        );

        ctx.stroke();

    }


    ctx.restore();

}


/* =====================================================
   DRAW BUILDINGS
===================================================== */

function drawBuildings(){

    const sorted =
        buildings.slice()
        .sort(
            function(a,b){

                return (
                    Math.hypot(
                        b.x-player.x,
                        b.y-player.y
                    ) -
                    Math.hypot(
                        a.x-player.x,
                        a.y-player.y
                    )
                );

            }
        );


    for(
        const building of sorted
    ){

        const screen =
            worldToScreen(
                building.x,
                building.y
            );


        if(
            screen.x < -300 ||
            screen.x > width+300 ||
            screen.y < -300 ||
            screen.y > height+300
        ){

            continue;

        }


        const size =
            Math.max(
                15,
                19000/
                Math.max(
                    screen.distance,
                    50
                )
            );


        const buildingHeight =
            size*
            building.height/
            180;


        ctx.fillStyle =
            "#354b5c";


        ctx.fillRect(

            screen.x-size/2,

            screen.y-
            buildingHeight,

            size,

            buildingHeight

        );


        ctx.fillStyle =
            "#243746";


        ctx.fillRect(

            screen.x-size/2,

            screen.y-
            buildingHeight,

            size,

            8

        );


        /* Fenster */

        ctx.fillStyle =
            "#49dfff";


        for(
            let row=0;
            row<4;
            row++
        ){

            ctx.fillRect(

                screen.x-
                size*.28,

                screen.y-
                buildingHeight+
                20+
                row*22,

                size*.13,

                9

            );


            ctx.fillRect(

                screen.x+
                size*.08,

                screen.y-
                buildingHeight+
                20+
                row*22,

                size*.13,

                9

            );

        }

    }

}


/* =====================================================
   DRAW ENEMIES
===================================================== */

function drawEnemies(){

    for(
        const enemy of enemies
    ){

        const screen =
            worldToScreen(
                enemy.x,
                enemy.y
            );


        if(
            screen.x < -150 ||
            screen.x > width+150 ||
            screen.y < -150 ||
            screen.y > height+150
        ){

            continue;

        }


        const size =
            Math.max(
                18,
                21000/
                Math.max(
                    screen.distance,
                    60
                )
            );


        /* Schatten */

        ctx.fillStyle =
            "rgba(0,0,0,.35)";


        ctx.beginPath();

        ctx.ellipse(
            screen.x,
            screen.y+
            size*.45,

            size*.45,
            size*.15,

            0,
            0,
            Math.PI*2
        );

        ctx.fill();


        /* Körper */

        ctx.fillStyle =
            "#566d80";


        ctx.fillRect(

            screen.x-
            size*.32,

            screen.y-
            size*.05,

            size*.64,

            size*.62

        );


        /* Kopf */

        ctx.fillStyle =
            "#7890a3";


        ctx.fillRect(

            screen.x-
            size*.4,

            screen.y-
            size*.58,

            size*.8,

            size*.4

        );


        /* Augen */

        ctx.fillStyle =
            "#4ceaff";


        ctx.fillRect(

            screen.x-
            size*.25,

            screen.y-
            size*.45,

            size*.14,

            size*.07

        );


        ctx.fillRect(

            screen.x+
            size*.11,

            screen.y-
            size*.45,

            size*.14,

            size*.07

        );


        /* Arme */

        ctx.fillStyle =
            "#304354";


        ctx.fillRect(

            screen.x-
            size*.52,

            screen.y,

            size*.16,

            size*.5

        );


        ctx.fillRect(

            screen.x+
            size*.36,

            screen.y,

            size*.16,

            size*.5

        );


        /* Beine */

        ctx.fillRect(

            screen.x-
            size*.23,

            screen.y+
            size*.58,

            size*.17,

            size*.4

        );


        ctx.fillRect(

            screen.x+
            size*.06,

            screen.y+
            size*.58,

            size*.17,

            size*.4

        );


        /* HP */

        ctx.fillStyle =
            "#111";


        ctx.fillRect(

            screen.x-
            size*.45,

            screen.y-
            size*.78,

            size*.9,

            6

        );


        ctx.fillStyle =
            "#4be56d";


        ctx.fillRect(

            screen.x-
            size*.45,

            screen.y-
            size*.78,

            size*.3*
            enemy.hp,

            6

        );

    }

}


/* =====================================================
   DRAW PROJECTILES
===================================================== */

function drawProjectiles(){

    for(
        const projectile of projectiles
    ){

        const screen =
            worldToScreen(
                projectile.x,
                projectile.y
            );


        ctx.shadowBlur =
            18;


        ctx.shadowColor =
            "#ff5738";


        ctx.fillStyle =
            "#ff704d";


        ctx.beginPath();

        ctx.arc(
            screen.x,
            screen.y,
            7,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.shadowBlur =
            0;

    }

}


/* =====================================================
   DRAW PARTICLES
===================================================== */

function drawParticles(){

    for(
        const particle of particles
    ){

        const screen =
            worldToScreen(
                particle.x,
                particle.y
            );


        ctx.fillStyle =
            "rgba(75,220,255,"+
            Math.max(
                0,
                particle.life
            )+
            ")";


        ctx.beginPath();

        ctx.arc(
            screen.x,
            screen.y,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =====================================================
   DRAW GRAPPLE
===================================================== */

function drawGrapple(){

    if(
        !grappleTarget
    ){

        return;

    }


    const target =
        worldToScreen(
            grappleTarget.x,
            grappleTarget.y
        );


    ctx.strokeStyle =
        "#50eaff";


    ctx.lineWidth =
        4;


    ctx.shadowBlur =
        12;


    ctx.shadowColor =
        "#50eaff";


    ctx.beginPath();

    ctx.moveTo(
        width/2,
        height/2
    );

    ctx.lineTo(
        target.x,
        target.y
    );

    ctx.stroke();


    ctx.shadowBlur =
        0;


    ctx.fillStyle =
        "#8af4ff";


    ctx.beginPath();

    ctx.arc(
        target.x,
        target.y,
        10,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   DRAW HAND
===================================================== */

function drawHand(){

    const x =
        width-100;

    const y =
        height-65;


    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.rotate(
        -.22
    );


    /* Arm */

    ctx.fillStyle =
        "#26394b";


    ctx.fillRect(
        -30,
        10,
        65,
        150
    );


    /* Hand */

    ctx.fillStyle =
        "#667f94";


    ctx.beginPath();

    ctx.roundRect(
        -75,
        -45,
        125,
        85,
        25
    );

    ctx.fill();


    /* Grapple device */

    ctx.fillStyle =
        "#28cfff";


    ctx.shadowBlur =
        20;


    ctx.shadowColor =
        "#28cfff";


    ctx.beginPath();

    ctx.moveTo(
        -25,
        -28
    );

    ctx.lineTo(
        12,
        5
    );

    ctx.lineTo(
        -25,
        38
    );

    ctx.lineTo(
        -58,
        5
    );

    ctx.closePath();

    ctx.fill();


    ctx.shadowBlur =
        0;


    ctx.restore();

}


/* =====================================================
   DRAW EVERYTHING
===================================================== */

function draw(){

    drawBackground();

    drawGrid();

    drawBuildings();

    drawEnemies();

    drawProjectiles();

    drawParticles();

    drawGrapple();

    drawHand();

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    document.getElementById(
        "hp"
    ).textContent =
        Math.max(
            0,
            Math.ceil(
                player.hp
            )
        );


    document.getElementById(
        "score"
    ).textContent =
        score;


    document.getElementById(
        "enemyCount"
    ).textContent =
        enemies.length;

}


/* =====================================================
   GAME OVER
===================================================== */

function checkGameOver(){

    if(
        player.hp <= 0 &&
        !gameOver
    ){

        player.hp = 0;

        gameOver = true;

        showMessage(
            "GAME OVER — R DRÜCKEN"
        );

    }

}


/* =====================================================
   MESSAGE
===================================================== */

let messageTimeout;


function showMessage(
    text
){

    const element =
        document.getElementById(
            "message"
        );


    element.textContent =
        text;


    element.classList.add(
        "show"
    );


    clearTimeout(
        messageTimeout
    );


    messageTimeout =
        setTimeout(
            function(){

                element.classList.remove(
                    "show"
                );

            },
            900
        );

}


/* =====================================================
   RESET
===================================================== */

function resetGame(){

    player.x = 0;

    player.y = 0;

    player.angle =
        -Math.PI/2;

    player.hp = 100;

    score = 0;

    gameOver = false;

    grappleTarget = null;

    grappleTime = 0;

    enemies.length = 0;

    projectiles.length = 0;

    particles.length = 0;


    for(
        let i=0;
        i<8;
        i++
    ){

        spawnEnemy();

    }


    showMessage(
        "UPDATE 4 — START!"
    );

}


/* =====================================================
   MAIN LOOP
===================================================== */

let lastTime =
    performance.now();


function gameLoop(
    currentTime
){

    const dt =
        Math.min(
            (currentTime-
            lastTime)/
            1000,

            .033
        );


    lastTime =
        currentTime;


    updatePlayer(dt);

    updateEnemies(dt);

    updateProjectiles(dt);

    updateParticles(dt);

    checkGameOver();

    draw();

    updateHUD();


    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   START
===================================================== */

showMessage(
    "UPDATE 4"
);


requestAnimationFrame(
    gameLoop
);

</script>
